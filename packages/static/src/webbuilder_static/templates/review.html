{% extends "storefront.html" %}
{% block title %}Review your order | {{ store.name }}{% endblock %}
{% block content %}
    <div class="page-banner">
      <div class="wrap"><h1 data-order-heading tabindex="-1">Review your order</h1></div>
    </div>
    <div class="wrap order-review">
      <a class="text-link" href="menu.html">← Back to menu</a>
      <fieldset class="cart-review" data-cart-review aria-label="Order review">
        <p class="cart-empty" data-cart-empty>Your cart is empty.</p>
        <ul class="cart-lines" data-cart-lines aria-label="Cart items"></ul>
        <div class="cart-subtotal"><span>Subtotal</span><strong data-cart-subtotal></strong></div>
        <div class="checkout" data-checkout hidden>
          <span>Simulated checkout</span>
          <button type="button" class="place-order" data-place-order>Place order</button>
        </div>
        <p class="checkout-error" role="alert" data-checkout-error></p>
      </fieldset>
      <div data-confirmation hidden>
        <ul class="cart-lines" data-confirmed-lines aria-label="Confirmed items"></ul>
        <div class="cart-subtotal"><span id="order-total-label">Total</span><strong><output aria-labelledby="order-total-label" data-confirmed-total></output></strong></div>
      </div>
      <template id="cart-line-template">
        <li class="cart-line">
          <div class="cart-item">
            <h2 class="cart-line-name" data-cart-name></h2>
            <span class="cart-unit-price" data-cart-unit-price></span>
          </div>
          <div class="cart-quantity">
            <button type="button" data-cart-action="decrease">−</button>
            <output aria-label="Quantity" data-cart-quantity></output>
            <button type="button" data-cart-action="increase">+</button>
          </div>
          <strong class="cart-line-total" data-cart-line-total></strong>
          <button type="button" data-cart-action="remove" class="cart-remove">Remove</button>
        </li>
      </template>
      <template id="confirmed-line-template">
        <li class="confirmed-line">
          <div>
            <h2 class="cart-line-name" data-confirmed-name></h2>
            <span class="cart-unit-price" data-confirmed-quantity></span>
          </div>
          <strong class="cart-line-total"><output aria-label="Line total" data-confirmed-line-total></output></strong>
        </li>
      </template>
      <p class="visually-hidden" role="status" data-cart-status></p>
    </div>
{% endblock %}
