[project]
name = "webbuilder-agent"
version = "0.1.0"
description = "Agent for generating white-label restaurant websites"
requires-python = ">=3.12"
dependencies = [
    "inspect-ai",
    "jinja2>=3.1.6",
    "openai",
]

[project.optional-dependencies]
agents-sdk = ["openai-agents"]

[project.scripts]
generate-storefront = "webbuilder_agent.storefront:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13"]
build-backend = "uv_build"
