[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "anyio>=4",
    "mypy>=1.18,<2",
    "pytest",
    "ruff>=0.14,<1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["packages", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
